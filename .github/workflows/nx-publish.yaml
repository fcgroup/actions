      #     NODE_AUTH_TOKEN: ''
      #     NPM_CONFIG_USERCONFIG: ''
      #     NPM_CONFIG_PROVENANCE: ${{ inputs.provenance }}
      #     NPM_CONFIG_REGISTRY: ${{ inputs.registry }}
